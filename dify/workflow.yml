            type: text
            value: '{{#llm_node.text#}}'
            file: []
          - key: metrics_json
            type: text
            value: '{{#parse_node.metrics_text#}}'
            file: []
          - key: contour_url
            type: text
            value: '{{#parse_node.contour_url#}}'
            file: []
          - key: heatmap_url
            type: text
            value: '{{#parse_node.heatmap_url#}}'
            file: []
          - key: site
            type: text
            value: '{{#start_node.site#}}'
            file: []
        timeout:
          connect: 10
          read: 30
          write: 30
        retry_config:
          enabled: true
          max_retries: 2
          retry_interval: 1000
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 10000
        ssl_verify: true
      height: 150
      id: report_node
      position:
        x: 1880
        y: 120
      positionAbsolute:
        x: 1880
        y: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
      zIndex: 0
    - data:
        desc: 取出报告地址，并给运行面板一份简报
        selected: false
        title: 汇总输出
        type: code
        code_language: python3
        variables:
