          value_selector:
          - report_node
          - body
        outputs:
          report_url:
            type: string
            children: null
          risk_level:
            type: string
            children: null
          summary:
            type: string
            children: null
        dependencies: []
        code: "import json\n\ndef main(resp: str) -> dict:\n    try:\n        d = json.loads(resp)\n \
          \   except Exception:\n        d = {}\n    return {\n        \"report_url\": d.get(\"report_url\"\
          , \"\"),\n        \"risk_level\": d.get(\"risk_level\", \"未知\"),\n        \"summary\": d.get(\"\
          markdown\", \"\") or \"报告渲染失败，请查看图像分析节点输出。\",\n    }"
      height: 78
      id: finish_node
      position:
        x: 2190
        y: 120
      positionAbsolute:
        x: 2190
        y: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
      zIndex: 0
    - data:
        desc: ''
        selected: false
        title: 结束
        type: end
        outputs:
        - variable: summary
          value_type: string
          value_selector:
          - merge_node
          - summary
          - output
        - variable: report_url
          value_type: string
          value_selector:
          - merge_node
          - report_url
          - output
        - variable: risk_level
          value_type: string
          value_selector:
          - merge_node
          - risk_level
          - output
      height: 139
      id: end_node
      position:
        x: 2810
        y: 120
      positionAbsolute:
        x: 2810
        y: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
      zIndex: 0
    - data:
        desc: 先判断是不是炉膛火焰照片，挡掉无关图片
        selected: false
        title: 图像校验
        type: llm
        model:
          provider: langgenius/openai_api_compatible/openai_api_compatible
          name: deepseek-v4-flash-vision-exp
          mode: chat
          completion_params:
            temperature: 0
        prompt_template:
        - role: system
          text: '你要判断一张照片是不是**电站锅炉炉膛内部**的火焰照片

            （通过看火孔或炉膛监视摄像头拍摄的那种）。


            只输出一个词，不要解释，不要标点：


            - 是炉膛内部火焰照片 → FLAME

            - 其他任何情况 → OTHER


            注意这些都算 OTHER：风景、人物、文档、聊天截图、设备外观照、

            仪表盘照片，以及蜡烛、篝火、烧烤、打火机等非炉膛的火焰。

            看不清或过暗到无法判断，也输出 OTHER。'
          id: chk-sys
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: true
          configs:
            variable_selector:
            - start_node
            - photo
            detail: low
      height: 98
      id: check_node
      position:
        x: 330
        y: 60
      positionAbsolute:
        x: 330
        y: 60
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 是火焰照片？
        type: if-else
        cases:
        - case_id: 'true'
          id: 'true'
          logical_operator: and
          conditions:
          - id: cond-flame
            comparison_operator: contains
            value: FLAME
            varType: string
            variable_selector:
            - check_node
            - text
      height: 126
      id: gate_node
      position:
        x: 640
        y: 60
      positionAbsolute:
        x: 640
        y: 60
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 输出重传提示
        selected: false
        title: 拒绝并说明
        type: code
        code_language: python3
        code: "def main() -> dict:\n    md = \"\\n\".join([\n        \"# ⚠️ 这不是炉膛火焰照片\",\n        \"\"\
          ,\n        \"上传的图片没有被识别为电站锅炉炉膛内部的火焰画面，已停止分析。\",\n        \"\",\n        \"请通过看火孔或炉膛监视摄像头重新拍摄，并确认：\"\
          ,\n        \"\",\n        \"- 画面主体是炉膛内的火焰，不是设备外观或仪表\",\n        \"- 曝光正常，不要过暗或过曝到看不出火焰形态\",\n\
          \        \"- 尽量拍全火焰，不要只拍到一角\",\n    ])\n    return {\"summary\": md, \"report_url\": \"\", \"\
          risk_level\": \"未分析\"}\n"
        variables: []
        outputs:
          summary:
            type: string
            children: null
          report_url:
            type: string
            children: null
          risk_level:
            type: string
            children: null
        dependencies: []
      height: 54
      id: reject_node
      position:
        x: 2190
        y: 300
      positionAbsolute:
        x: 2190
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
