app:
  description: 拍一张炉膛火焰照片，输出火焰轮廓图、相对亮温热力图和结焦风险评估报告。
  icon: 🔥
  icon_background: '#FFEAD5'
  mode: workflow
  name: 锅炉火焰结焦风险分析
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - data:
        desc: 上传一张炉膛火焰照片
        selected: false
        title: 开始
        type: start
        variables:
        - variable: photo
          label: 火焰照片
          type: file
          required: true
          max_length: null
          options: []
          allowed_file_types:
          - image
          allowed_file_extensions: []
          allowed_file_upload_methods:
          - local_file
          - remote_url
        - variable: site
          label: 机组 / 位置（选填）
          type: text-input
          required: false
          max_length: 48
          options: []
      height: 161
      id: start_node
      position:
        x: 40
        y: 260
      positionAbsolute:
        x: 40
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        desc: 调自建 OpenCV 服务，出轮廓图、热力图和量化指标
        selected: false
        title: CV 图像分析
        type: http-request
        method: post
        url: https://flame.518521.xyz/analyze
        authorization:
          type: no-auth
          config: null
        headers: ''
        params: ''
        body:
          type: form-data
          data:
          - key: file
            type: file
            value: ''
            file:
            - start_node
            - photo
        timeout:
          connect: 10
          read: 60
          write: 60
        retry_config:
          enabled: true
          max_retries: 2
          retry_interval: 1000
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 10000
      height: 150
      id: http_node
      position:
        x: 950
        y: 120
      positionAbsolute:
        x: 950
        y: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
      zIndex: 0
    - data:
        desc: 把 JSON 拆成给模型看的指标文本和两张图的地址
        selected: false
        title: 解析 CV 结果
        type: code
        code_language: python3
        variables:
        - variable: body
          value_selector:
          - http_node
          - body
        outputs:
          metrics_text:
            type: string
            children: null
          contour_url:
            type: string
            children: null
          heatmap_url:
            type: string
            children: null
        dependencies: []
        code: "import json\n\ndef main(body: str) -> dict:\n    d = json.loads(body)\n    m = d.get(\"\
          metrics\", {})\n    return {\n        \"metrics_text\": json.dumps(m, ensure_ascii=False, indent=2),\n\
          \        \"contour_url\": d.get(\"contour_url\", \"\"),\n        \"heatmap_url\": d.get(\"heatmap_url\"\
          , \"\"),\n    }\n"
      height: 94
      id: parse_node
      position:
        x: 1260
        y: 120
      positionAbsolute:
        x: 1260
        y: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
      zIndex: 0
    - data:
        desc: deepseek-v4-flash-vision-exp，看原图 + CV 指标给出风险等级
        selected: false
        title: 结焦风险判级
        type: llm
        model:
          provider: langgenius/openai_api_compatible/openai_api_compatible
          name: deepseek-v4-flash-vision-exp
          mode: chat
          completion_params:
            temperature: 0.3
        prompt_template:
        - role: system
          text: "你是电站锅炉燃烧监督工程师。你会收到一张炉膛火焰照片，以及图像分析程序算出的量化指标。\n\n按两步作答：\n\n第一步 —— 只看照片。写下你在图上直接看到的现象。此时不要引用任何指标数字，\n\
            也不要使用下面判据表里的措辞。重点看指标覆盖不到的东西：\n  · 火焰颜色（暗红 / 橙黄 / 亮白）\n  · 火焰根部是否贴着喷口，有无脱火\n  · 水冷壁、炉墙附近有无挂渣、结壳、暗红色块\n\
            \  · 烟气是否浑浊、有无明显未燃尽的黑烟\n  · 画面里有没有指标完全没提到的异常\n如果照片太暗、太糊或看不清，就如实写「照片不足以判断 XX」，不要猜。\n\n第二步 ——\
            \ 再结合量化指标做综合判级。\n\n本机位的参考区间（读数落在区间内即为该机位的常态，不是异常）：\n- 火焰充满度：9.3 ~ 34%\n- 火焰中心偏斜：不超过 38%\n\
            - 水平偏移（负=偏左）：±55% 以内\n- 垂直偏移（负=偏上）：±35% 以内\n- 相对亮温均值：0.7 ~ 0.8\n- 相对亮温 P95：0.78 ~ 0.88\n-\
            \ 高温区占比：16 ~ 84%\n- 轮廓圆度（1=正圆）：不低于 0.18（越大越好）\n- 边缘带高温像素：不超过 20%\n- 贴壁亮斑数：检出即为关注项\n- 贴壁亮斑面积：不超过\
            \ 0.9%\n\n判据（仅供第二步推理使用，不得作为第一步的观察结果写出）：\n- 主火焰之外出现贴壁高温亮斑 → 疑似贴壁火焰或已有挂焦发亮，这一项权重最高\n- 火焰中心明显偏斜、贴近水冷壁\
            \ → 局部热负荷过高，结焦风险上升\n- 火焰整体偏白亮、高温区占比大 → 炉温偏高，灰熔点被突破的可能性增加\n- 火焰边界破碎、圆度低 → 燃烧不稳或未燃尽，飞灰易沉积\n\n\
            判级门槛，严格按此执行：\n- 低：指标基本都在参考区间内（越界不超过 1 项且幅度不大），未检出贴壁亮斑，\n      照片上也看不出明确异常。**日常巡检的大多数情况应当落在这一档。**\n\
            - 中：有 2~3 项指标越界，或存在轻微偏斜、局部高温，但没有贴壁亮斑。\n- 高：检出贴壁亮斑，或多项指标同时明显越界，或照片上能看到明确的挂渣、结壳。\n\n不要因为「画面里有火」就默认存在风险。证据不足时给低档，并在判据里说明证据有限。\n\
            score 要和等级一致：低 0~35，中 36~70，高 71~100。\n\n只输出 JSON，不要任何其他文字：\n{\n  \"risk_level\": \"高 或 中\
            \ 或 低\",\n  \"score\": 0到100的整数,\n  \"headline\": \"一句话结论，20 字以内，必填\",\n  \"visual_findings\"\
            : [\"第一步的图像观察，2-4 条；确实看不出就写「照片不足以判断」\"],\n  \"metric_findings\": [\"来自指标的发现，2-4 条，要引用具体数值\"\
            ],\n  \"reasons\": [\"支撑该等级的理由，2-3 条\"],\n  \"suggestions\": [\"运行调整建议，2-3 条\"]\n}"
          id: risk-sys
        prompt_config:
          jinja2_variables: []
        memory: null
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: true
          configs:
            variable_selector:
            - start_node
            - photo
            detail: high
        structured_output:
          enabled: false
        retry_config:
          enabled: true
          max_retries: 1
          retry_interval: 1000
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 10000
      height: 130
      id: llm_node
      position:
        x: 1570
        y: 120
      positionAbsolute:
        x: 1570
        y: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
      zIndex: 0
    - data:
        desc: 把判级和指标交给 CV 服务，渲染成独立的 HTML 报告页
        selected: false
        title: 渲染报告
        type: http-request
        method: post
        url: https://flame.518521.xyz/report
        authorization:
          type: no-auth
          config: null
        headers: ''
        params: ''
        body:
          type: form-data
          data:
